<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
}

.scene{
    margin-top: 60px;
    width: 350px;
    height: 450px;
    perspective: 1000px;   /* перспектика 3Д*/
} 

.card{
    width: 100%;
    height: 100%;

    position: relative;

    transform-style: preserve-3d; /* стиль анімації 3Д*/

    transition: 2s;
} 

.front,
.back{
    width: 100%;
    height: 100%;

    position: absolute;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;

    border-radius: 30px;

    backface-visibility: hidden; /* накладення елементів */
}

.front{
    background-color: rgb(56, 56, 236);
}

.back{
    background-color: rgb(199, 199, 16);
    transform: rotateY(180deg);
}

.scene:hover .card{
    transform: rotateY(180deg);
}
img{
    width:400px;
    height:400px;
}
    </style>
</head>
<body>
    
    <div class="scene">
        <div class="card">
            <div class="front">
                <img src="./img/avokado.jpg" alt="" srcset="">
            </div>
            <div class="back">
                <img src="./img/bonitolos.jpg" alt="" srcset="">
            </div>
        </div>
    </div>
</body>
</html>
